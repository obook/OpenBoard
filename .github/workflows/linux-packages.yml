name: Linux packages

on:
  push:
    branches: [shapes-1.7]
    tags: ['v*']
  workflow_dispatch:

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu_24.04
            image: ubuntu:24.04
            packages: qt6-l10n-tools
            cmake_options: ''
          # the poppler headers shipped by KDE neon need C++20
          - name: kde-neon
            image: invent-registry.kde.org/neon/docker-images/plasma:user
            packages: ''
            cmake_options: -DCMAKE_CXX_STANDARD=20
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - name: Install the build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config dpkg-dev file ca-certificates \
            qt6-base-dev qt6-base-private-dev qt6-multimedia-dev qt6-svg-dev \
            qt6-webengine-dev qt6-webchannel-dev qt6-declarative-dev qt6-positioning-dev \
            qt6-tools-dev qt6-tools-dev-tools qt6-5compat-dev \
            libgl1-mesa-dev libquazip1-qt6-dev \
            libpoppler-dev libpoppler-cpp-dev libpoppler-private-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            libssl-dev zlib1g-dev libx11-dev libcups2-dev libasound2-dev \
            ${{ matrix.packages }}

      - name: Check out OpenBoard
        uses: actions/checkout@v4

      - name: Build OpenBoard
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr ${{ matrix.cmake_options }}
          ninja -C build

      # a tag v1.7.7-shapes.2 gives the package version 1.7.7+shapes.2,
      # any other ref keeps the version of version.txt
      - name: Build the package
        working-directory: build
        run: |
          case "$GITHUB_REF_NAME" in
            v*) VERSION=$(echo "${GITHUB_REF_NAME#v}" | sed 's/-/+/') ;;
            *) VERSION= ;;
          esac
          cpack -G DEB ${VERSION:+-R "$VERSION"} -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON
          for f in openboard_*.deb; do
            mv "$f" "openboard_${{ matrix.name }}_${f#openboard_}"
          done

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: openboard-${{ matrix.name }}
          path: build/openboard_*.deb
